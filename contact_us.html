<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
  />
  <title>Contact Us - Pleasurable Travels</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>

  <!-- Navbar -->
  <nav>
    <h1><i>Pleasurable Travels</i></h1>
    <ul>
      <li><a href="./travel_recommendation.html" id="home">Home</a></li>
      <li><a href="./about_us.html" id="aboutus">About Us</a></li>
      <li><a href="./contact_us.html" id="contactus">Contact Us</a></li>
    </ul>
  </nav>

  <!-- Social Sidebar -->
  <div class="social-sidebar">
    <a href="#" class="twitter" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
    <a href="#" class="facebook" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="#" class="instagram" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" class="youtube" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
  </div>

  <section class="intro-card contact-card">
  <h1>Contact Us</h1>
  <p>We’d love to hear from you! Send us a message and we’ll get back to you as soon as possible.</p>

  <form id="contact_form">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Your Name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Your Email" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="5" placeholder="Your Message" required></textarea>

    <button type="submit" class="book-btn">Send Message</button>
  </form>
</section>


</body>
</html>
